name: one-shot-inspect-cloudflare-build-v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-inspect-cloudflare-build-v2.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Cloudflare Workers Builds metadata safely
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_UUID: 298b72cb-b047-46bd-aff4-d0d8993267f6
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="$(python - <<'PY'
          import os,re
          value=os.environ.get('RAW_CF_TOKEN','').strip()
          for quote in ('"', "'"):
              if len(value)>=2 and value.startswith(quote) and value.endswith(quote): value=value[1:-1].strip()
          for prefix in ('CLOUDFLARE_API_TOKEN=','CF_API_TOKEN='):
              if value.upper().startswith(prefix): value=value[len(prefix):].strip()
          bearer=re.search(r'(?i)Bearer\s+([^\s"\']+)',value)
          if bearer: value=bearer.group(1).strip()
          prefixed=re.search(r'(cf(?:ut|at)_[A-Za-z0-9_-]+)',value)
          if prefixed: value=prefixed.group(1)
          print(value.strip().strip('"\'`;,') ,end='')
          PY
          )"
          CF_ACCOUNT_ID="$(python - <<'PY'
          import os,re
          value=os.environ.get('RAW_CF_ACCOUNT','').strip()
          for quote in ('"', "'"):
              if len(value)>=2 and value.startswith(quote) and value.endswith(quote): value=value[1:-1].strip()
          for prefix in ('CLOUDFLARE_ACCOUNT_ID=','CF_ACCOUNT_ID='):
              if value.upper().startswith(prefix): value=value[len(prefix):].strip()
          match=re.search(r'\b[0-9a-fA-F]{32}\b',value)
          if match: value=match.group(0)
          print(value.strip().strip('"\'`;,') ,end='')
          PY
          )"
          echo "::add-mask::$CF_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          export CF_TOKEN CF_ACCOUNT_ID
          python - <<'PY'
          import json,os,re,urllib.request,urllib.error
          token=os.environ['CF_TOKEN']; account=os.environ['CF_ACCOUNT_ID']; build_uuid=os.environ['BUILD_UUID']
          def get(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try:p=json.loads(raw)
                  except Exception:p={}
                  return e.code,p
          def errs(p): return [{'code':e.get('code'),'message':str(e.get('message',''))[:160]} for e in (p.get('errors') or [])]
          s,p=get(f'/accounts/{account}/workers/scripts'); print('workers_scripts_status=',s)
          if s!=200 or p.get('success') is not True: print('workers_scripts_errors=',json.dumps(errs(p))); raise SystemExit(0)
          w=next((x for x in p.get('result',[]) if x.get('id')=='rivexis-web'),None); print('worker_found=',bool(w))
          if not w: raise SystemExit(0)
          tag=w.get('tag')
          s,p=get(f'/accounts/{account}/builds/workers/{tag}/triggers'); print('triggers_status=',s)
          if s==200 and p.get('success') is True:
              out=[]
              for t in p.get('result') or []:
                  out.append({k:t.get(k) for k in ('trigger_uuid','trigger_name','build_command','deploy_command','root_directory','branch_includes','branch_excludes','path_includes','path_excludes')})
              print('triggers=',json.dumps(out,sort_keys=True))
          else: print('triggers_errors=',json.dumps(errs(p)))
          s,p=get(f'/accounts/{account}/builds/workers/{tag}/builds'); print('builds_status=',s)
          if s==200 and p.get('success') is True:
              rows=p.get('result') or []
              if isinstance(rows,dict): rows=rows.get('builds') or []
              b=next((x for x in rows if x.get('build_uuid')==build_uuid),None)
              if b:
                  m=b.get('build_trigger_metadata') or {}
                  print('target_build=',json.dumps({'build_uuid':b.get('build_uuid'),'build_outcome':b.get('build_outcome'),'status':b.get('status'),'branch':m.get('branch'),'commit_hash':m.get('commit_hash'),'build_command':m.get('build_command'),'deploy_command':m.get('deploy_command'),'root_directory':m.get('root_directory'),'trigger_source':m.get('build_trigger_source')},sort_keys=True))
              else: print('target_build=NOT_FOUND')
          else: print('builds_errors=',json.dumps(errs(p)))
          s,p=get(f'/accounts/{account}/builds/builds/{build_uuid}/logs'); print('logs_status=',s)
          if s!=200 or p.get('success') is not True: print('logs_errors=',json.dumps(errs(p))); raise SystemExit(0)
          raw=json.dumps(p.get('result') or '')
          raw=re.sub(r'(?i)(authorization|token|secret|password|apikey|api_key)[=: ]+[^\s,;\"}]+',r'\1=[REDACTED]',raw)
          raw=re.sub(r'cf(?:ut|at)_[A-Za-z0-9_-]+','[REDACTED_TOKEN]',raw)
          hits=[]
          for line in re.split(r'\\n|\\r',raw):
              low=line.lower()
              if any(x in low for x in ('error','failed','failure','exit code','command not found','enoent','npm err','wrangler')):
                  line=re.sub(r'https?://[^\s\"}]+','[URL]',line)
                  line=re.sub(r'\s+',' ',line).strip()
                  if line and line not in hits:hits.append(line[:450])
              if len(hits)>=10:break
          print('safe_error_excerpt=',json.dumps(hits))
          PY
      - name: Remove diagnostic workflow
        if: always()
        run: |
          rm .github/workflows/one-shot-inspect-cloudflare-build-v2.yml
          git config user.name "Rivexis Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove Cloudflare build diagnostic v2" || exit 0
          git push origin HEAD:main
