name: one-shot-deploy-supabase-edge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-deploy-supabase-edge.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require configured Supabase deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured for this repository."
            exit 1
          fi
      - name: Deploy certified rivexis-api source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy rivexis-api --project-ref ivszvufdonfgwjpfgwii --no-verify-jwt
      - name: Verify deployed health capability
        run: |
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 https://ivszvufdonfgwjpfgwii.supabase.co/functions/v1/rivexis-api/health)"
          printf '%s\n' "$body"
          echo "$body" | grep -q '"status":"ready"'
          echo "$body" | grep -q '"organization_workspace_create":true'
      - name: Remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/one-shot-deploy-supabase-edge.yml
          git config user.name "Rivexis Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete Rivexis Edge production deployment"
          git push origin HEAD:main
