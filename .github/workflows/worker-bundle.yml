name: worker-bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install from configured Cloudflare project root
        run: npm ci
      - name: Build Vinext Cloudflare output
        run: npm run build:vinext
        env:
          NEXT_PUBLIC_RIVEXIS_API_URL: same-origin
          NEXT_PUBLIC_RIVEXIS_BUILD_SHA: ${{ github.sha }}
      - name: Validate generated Worker with Wrangler dry-run
        run: npx wrangler deploy --config dist/server/wrangler.json --dry-run

  validate-cloudflare-default-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository root
        run: npm ci
      - name: Run Cloudflare default root build
        run: npm run build
        env:
          WORKERS_CI: '1'
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      - name: Run Cloudflare default root deploy dry-run
        run: npx wrangler deploy --dry-run
