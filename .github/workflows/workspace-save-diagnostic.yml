name: workspace-save-diagnostic
on:
  push:
    branches: ['fix/workspace-menu-clipping-20261022']
    paths: ['apps/web/e2e/financial-request-context.spec.ts', '.github/workflows/workspace-save-diagnostic.yml']
permissions:
  contents: read
jobs:
  isolated-firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: 'npm'}
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps firefox
        working-directory: apps/web
      - run: npx playwright test e2e/financial-request-context.spec.ts --config=playwright.compatibility.config.ts --project=firefox --grep='a stale save completion' --repeat-each=3 --workers=1 --retries=0
        working-directory: apps/web
