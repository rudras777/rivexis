name: one-shot-org-workspace-ui

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-org-workspace-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply organization workspace Settings parity
        shell: python
        run: |
          from pathlib import Path

          page=Path('apps/web/app/workspace/settings/page.tsx')
          text=page.read_text()

          state_anchor='''  const [orgName,setOrgName]=useState("Rivexis Organization");\n  const [selectedOrgId,setSelectedOrgId]=useState("");\n'''
          state_replacement='''  const [orgName,setOrgName]=useState("Rivexis Organization");\n  const [orgWorkspaceName,setOrgWorkspaceName]=useState("Organization Workspace");\n  const [orgWorkspaceRole,setOrgWorkspaceRole]=useState("Analyst");\n  const [selectedOrgId,setSelectedOrgId]=useState("");\n'''
          if text.count(state_anchor)!=1: raise SystemExit('state anchor mismatch')
          text=text.replace(state_anchor,state_replacement,1)

          role_anchor='''  const memberRole=members.data?.member_role??selectedOrg?.member_role??"";\n  const canAdmin=memberRole==="OWNER"||memberRole==="ADMIN";\n  const roleChoices=memberRole==="OWNER"?ORG_ROLES:ORG_ROLES.filter(value=>value!=="OWNER");\n'''
          role_replacement='''  const memberRole=members.data?.member_role??selectedOrg?.member_role??"";\n  const canAdmin=memberRole==="OWNER"||memberRole==="ADMIN";\n  const canCreateOrgWorkspace=memberRole==="OWNER"||memberRole==="ADMIN"||memberRole==="ANALYST";\n  const roleChoices=memberRole==="OWNER"?ORG_ROLES:ORG_ROLES.filter(value=>value!=="OWNER");\n'''
          if text.count(role_anchor)!=1: raise SystemExit('role anchor mismatch')
          text=text.replace(role_anchor,role_replacement,1)

          mutation_anchor='''  const makeOrg=useMutation({\n'''
          mutation='''  const makeOrgWs=useMutation({\n    mutationFn:()=>api<Workspace>("/api/v1/workspaces",{method:"POST",body:JSON.stringify({name:orgWorkspaceName.trim(),role:orgWorkspaceRole,organization_id:selectedOrgId})}),\n    onSuccess:r=>{\n      qc.setQueryData<{items:Workspace[]}>(["workspace-settings"],old=>({items:[...(old?.items??[]).filter(w=>w.id!==r.id),r]}));\n      qc.setQueryData<{items:Workspace[]}>(["workspaces-shell"],old=>({items:[...(old?.items??[]).filter(w=>w.id!==r.id),r]}));\n      switchWorkspace(r.id);\n      void qc.invalidateQueries({queryKey:["workspace-settings"]});\n      void qc.invalidateQueries({queryKey:["workspaces-shell"]});\n    }\n  });\n\n'''
          if text.count(mutation_anchor)!=1: raise SystemExit('mutation anchor mismatch')
          text=text.replace(mutation_anchor,mutation+mutation_anchor,1)

          ui_anchor='''    {selectedOrg?<section className="panel" data-testid="organization-member-admin">'''
          ui='''    {selectedOrg?<section className="panel" data-testid="organization-workspace-create"><div className="panelHeading"><div><span className="workspaceKicker">Organization workspace</span><h2>Create {selectedOrg.name} workspace</h2><p className="sectionLead">This workspace is governed by current organization membership. Creator lineage never overrides a later role downgrade or membership removal.</p></div><span className="badge">{memberRole||selectedOrg.member_role}</span></div>\n      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr auto",gap:12,alignItems:"end"}}><label className="field">Organization workspace name<input aria-label="Organization workspace name" value={orgWorkspaceName} onChange={e=>setOrgWorkspaceName(e.target.value)}/></label><label className="field">Context<select aria-label="Organization workspace context" value={orgWorkspaceRole} onChange={e=>setOrgWorkspaceRole(e.target.value)}><option>Individual</option><option>Fund</option><option>Treasury</option><option>Analyst</option></select></label><button className="button" type="button" disabled={!canCreateOrgWorkspace||makeOrgWs.isPending||orgWorkspaceName.trim().length<2} onClick={()=>makeOrgWs.mutate()}>{makeOrgWs.isPending?"Creating…":"Create organization workspace"}</button></div>\n      {!canCreateOrgWorkspace?<p className="sectionLead">VIEWER membership is read-only. Ask an organization owner or administrator to grant ANALYST or higher access before creating a workspace.</p>:null}\n      {makeOrgWs.isSuccess?<p role="status">Created <b>{makeOrgWs.data.name}</b> inside <b>{selectedOrg.name}</b> with {makeOrgWs.data.access_role} access and made it active.</p>:null}\n      {makeOrgWs.isError?<p className="error" role="alert">{makeOrgWs.error instanceof ApiError&&makeOrgWs.error.status===403?"Your current organization role does not permit workspace creation.":"Rivexis could not create the organization workspace safely. Review the input and retry."}</p>:null}\n    </section>:null}\n\n'''
          if text.count(ui_anchor)!=1: raise SystemExit('UI anchor mismatch')
          text=text.replace(ui_anchor,ui+ui_anchor,1)
          page.write_text(text)

          test=Path('apps/web/e2e/organization-workspace-create.spec.ts')
          test.write_text('''import {expect,test} from "@playwright/test";\n\nconst corsHeaders={\n  "Access-Control-Allow-Origin":"http://127.0.0.1:3000",\n  "Access-Control-Allow-Credentials":"true",\n};\n\ntest("organization workspace creation is explicitly scoped to the selected writable organization",async({page})=>{\n  let posted:Record<string,unknown>|null=null;\n  await page.route("**/health",route=>route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({status:"ready"})}));\n  await page.route("**/api/v1/auth/web/csrf",route=>route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({csrf_token:"org-workspace-csrf"})}));\n  await page.route("**/api/v1/workspaces",async route=>{\n    if(route.request().method()==="POST"){\n      posted=route.request().postDataJSON() as Record<string,unknown>;\n      await route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({id:"org-w2",name:"Risk Operations",role:"Fund",organization_id:"org-1",access_role:"ANALYST",created_at:"2026-10-04T15:00:00Z"})});\n      return;\n    }\n    await route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({items:[{id:"w1",name:"Personal",role:"Analyst",organization_id:null,access_role:"OWNER"}]})});\n  });\n  await page.route("**/api/v1/organizations",route=>route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({items:[{id:"org-1",name:"Risk Council",member_role:"ANALYST",created_at:"2026-10-04T14:00:00Z"}]})}));\n  await page.route("**/api/v1/organizations/org-1/members",route=>route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({member_role:"ANALYST",items:[]})}));\n\n  await page.goto("/workspace/settings");\n  await expect(page.getByRole("heading",{name:"Create Risk Council workspace"})).toBeVisible();\n  await page.getByLabel("Organization workspace name").fill("Risk Operations");\n  await page.getByLabel("Organization workspace context").selectOption("Fund");\n  await page.getByRole("button",{name:"Create organization workspace"}).click();\n\n  await expect.poll(()=>posted).not.toBeNull();\n  expect(posted).toEqual({name:"Risk Operations",role:"Fund",organization_id:"org-1"});\n  await expect(page.getByRole("status")).toContainText("Created Risk Operations inside Risk Council with ANALYST access");\n});\n\ntest("viewer organization membership cannot create a workspace",async({page})=>{\n  await page.route("**/health",route=>route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({status:"ready"})}));\n  await page.route("**/api/v1/workspaces",route=>route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({items:[]})}));\n  await page.route("**/api/v1/organizations",route=>route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({items:[{id:"org-view",name:"Read Only Council",member_role:"VIEWER",created_at:"2026-10-04T14:00:00Z"}]})}));\n  await page.route("**/api/v1/organizations/org-view/members",route=>route.fulfill({status:200,contentType:"application/json",headers:corsHeaders,body:JSON.stringify({member_role:"VIEWER",items:[]})}));\n\n  await page.goto("/workspace/settings");\n  await expect(page.getByRole("button",{name:"Create organization workspace"})).toBeDisabled();\n  await expect(page.getByText("VIEWER membership is read-only.",{exact:false})).toBeVisible();\n});\n''')

          source=page.read_text()
          required=[
            'organization_id:selectedOrgId',
            'canCreateOrgWorkspace=memberRole==="OWNER"||memberRole==="ADMIN"||memberRole==="ANALYST"',
            'data-testid="organization-workspace-create"',
            'Creator lineage never overrides',
          ]
          for value in required:
            if value not in source: raise SystemExit(f'missing UI contract: {value}')
      - name: Verify changed TypeScript parses structurally
        run: |
          test -f apps/web/e2e/organization-workspace-create.spec.ts
          grep -q 'organization_id:selectedOrgId' apps/web/app/workspace/settings/page.tsx
          grep -q 'Create organization workspace' apps/web/app/workspace/settings/page.tsx
      - name: Remove one-shot workflow and push patch
        run: |
          rm .github/workflows/one-shot-org-workspace-ui.yml
          git config user.name "Rivexis Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add organization workspace creation UI"
          git push origin HEAD:main
