name: cloudflare-production-recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-production-recovery.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-and-deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_RIVEXIS_API_URL: same-origin
      NEXT_PUBLIC_RIVEXIS_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Certify exact web source and Worker bundle
        run: |
          set -euo pipefail
          npm run lint:web
          npm run typecheck:web
          npm run build:web
          npm --workspace @rivexis/web run build:vinext
          node scripts/npm-audit-ci.mjs
          npx wrangler deploy --dry-run --config apps/web/dist/server/wrangler.json
      - name: Authorize Cloudflare with short-lived device flow
        run: npx wrangler login --device --browser=false
      - name: Deploy exact certified SHA to authoritative Worker
        run: npx wrangler deploy --config apps/web/dist/server/wrangler.json
      - name: Verify authoritative production SHA
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          url="https://rivexis-web.rudrasingh0718.workers.dev/?build=${expected}"
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$url" || true)"
            if printf '%s' "$body" | grep -Fq 'rivexis-build' && printf '%s' "$body" | grep -Fq "$expected"; then
              printf '%s' "$body" | grep -Fq 'Evidence before'
              echo "Verified production SHA ${expected}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Authoritative Worker did not expose ${expected}."
          exit 1
