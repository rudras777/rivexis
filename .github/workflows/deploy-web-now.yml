name: deploy-web-now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web-now.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivexis-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_RIVEXIS_API_URL: same-origin
      NEXT_PUBLIC_RIVEXIS_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Cloudflare authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          response="$(curl -sS --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          RESPONSE="$response" python - <<'PY'
          import json, os, sys
          try:
              payload=json.loads(os.environ.get('RESPONSE',''))
          except Exception:
              payload={}
          if payload.get('success') is not True:
              errors=payload.get('errors') or []
              codes=','.join(str(e.get('code')) for e in errors if e.get('code') is not None) or 'unknown'
              print(f'::error::Cloudflare token verification failed (codes: {codes})')
              sys.exit(1)
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Build certified Worker
        run: npm run build:vinext
      - name: Deploy rivexis-web
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Verify exact build is live
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          url="https://rivexis-web.rudrasingh0718.workers.dev/?build=${expected}"
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$url" || true)"
            if printf '%s' "$body" | grep -Fq "$expected"; then
              printf '%s' "$body" | grep -Fq 'rivexis-build'
              echo "Verified ${expected} live." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public Worker did not expose ${expected}."
          exit 1
