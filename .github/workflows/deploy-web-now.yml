name: deploy-web-now

on:
  push:
    branches: [main]
    paths:
      - '.github/deploy-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivexis-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_RIVEXIS_API_URL: same-origin
      NEXT_PUBLIC_RIVEXIS_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          normalized_token="$(python - <<'PY'
          import os, re
          value=os.environ.get('CLOUDFLARE_API_TOKEN','').strip()
          for prefix in ('CLOUDFLARE_API_TOKEN=','CF_API_TOKEN='):
              if value.upper().startswith(prefix):
                  value=value[len(prefix):].strip()
          value=value.strip().strip('"\'`;,')
          bearer=re.search(r'(?i)Bearer\s+([^\s"\']+)', value)
          if bearer:
              value=bearer.group(1).strip()
          prefixed=re.search(r'(cf(?:ut|at)_[A-Za-z0-9_-]{35,})', value)
          if prefixed:
              value=prefixed.group(1)
          else:
              candidates=re.findall(r'(?<![A-Za-z0-9_-])([A-Za-z0-9_-]{35,100})(?![A-Za-z0-9_-])', value)
              candidates=[c for c in candidates if c.upper() not in {'CLOUDFLARE_API_TOKEN','CF_API_TOKEN'}]
              if candidates:
                  value=max(candidates, key=len)
          value=''.join(value.split()).strip().strip('"\'`;,')
          print(value, end='')
          PY
          )"
          normalized_account="$(python - <<'PY'
          import os, re
          value=os.environ.get('CLOUDFLARE_ACCOUNT_ID','').strip()
          match=re.search(r'\b[0-9a-fA-F]{32}\b', value)
          if match:
              value=match.group(0)
          print(value.strip().strip('"\'`;,'), end='')
          PY
          )"
          test -n "$normalized_token" || { echo '::error::Cloudflare API token is empty after normalization'; exit 1; }
          test -n "$normalized_account" || { echo '::error::Cloudflare account ID is empty after normalization'; exit 1; }
          echo "::add-mask::$normalized_token"
          echo "::add-mask::$normalized_account"
          echo "CLOUDFLARE_API_TOKEN=$normalized_token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$normalized_account" >> "$GITHUB_ENV"
      - name: Verify Cloudflare authority
        shell: bash
        run: |
          set -euo pipefail
          user_response="$(curl -sS --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          account_response="$(curl -sS --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" || true)"
          USER_RESPONSE="$user_response" ACCOUNT_RESPONSE="$account_response" python - <<'PY'
          import json, os, sys
          payloads=[]
          for key,label in [('USER_RESPONSE','user'),('ACCOUNT_RESPONSE','account')]:
              try:
                  payload=json.loads(os.environ.get(key,''))
              except Exception:
                  payload={}
              payloads.append((label,payload))
          if any(payload.get('success') is True for _,payload in payloads):
              sys.exit(0)
          summaries=[]
          for label,payload in payloads:
              errors=payload.get('errors') or []
              codes=','.join(str(e.get('code')) for e in errors if e.get('code') is not None) or 'unknown'
              summaries.append(f'{label}:{codes}')
          print(f"::error::Cloudflare token verification failed ({'; '.join(summaries)})")
          sys.exit(1)
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Build certified Worker
        run: npm run build:vinext
      - name: Deploy rivexis-web
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Verify exact build is live
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          url="https://rivexis-web.rudrasingh0718.workers.dev/?build=${expected}"
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$url" || true)"
            if printf '%s' "$body" | grep -Fq "$expected"; then
              printf '%s' "$body" | grep -Fq 'rivexis-build'
              echo "Verified ${expected} live." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public Worker did not expose ${expected}."
          exit 1
