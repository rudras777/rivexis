name: rvea-production-audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rvea-production-audit.yml'
      - 'scripts/audit-rvea-cloudflare.mjs'
      - 'scripts/audit-rvea-cloudflare.test.mjs'

permissions:
  contents: read

concurrency:
  group: rvea-production-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify read and redaction boundaries before accessing credentials
        run: node --test scripts/audit-rvea-cloudflare.test.mjs
      - name: Read existing Cloudflare configuration without changing it
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/audit-rvea-cloudflare.mjs "$RUNNER_TEMP/rvea-cloudflare-audit.json"
      - name: Retain the allowlisted configuration report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rvea-cloudflare-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/rvea-cloudflare-audit.json
          if-no-files-found: error
          retention-days: 7
