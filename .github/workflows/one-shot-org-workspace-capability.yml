name: one-shot-org-workspace-capability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-org-workspace-capability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gate organization workspace UI on deployed Edge capability
        shell: python
        run: |
          from pathlib import Path

          edge=Path('supabase/functions/rivexis-api/index.ts')
          edge_text=edge.read_text()
          old_health='''    if(path==="/health")return json(req,{status:"ready",service:"rivexis-api",runtime:"supabase-edge",api_version:"v1",environment:"production"});'''
          new_health='''    if(path==="/health")return json(req,{status:"ready",service:"rivexis-api",runtime:"supabase-edge",api_version:"v1",environment:"production",capabilities:{organization_workspace_create:true}});'''
          if edge_text.count(old_health)!=1: raise SystemExit('Edge health anchor mismatch')
          edge.write_text(edge_text.replace(old_health,new_health,1))

          page=Path('apps/web/app/workspace/settings/page.tsx')
          text=page.read_text()
          query_anchor='''  const orgs=useQuery({queryKey:["organizations"],queryFn:()=>api<{items:Org[]}>("/api/v1/organizations"),retry:false});\n'''
          query_replacement=query_anchor+'''  const runtimeCapabilities=useQuery({queryKey:["runtime-capabilities"],queryFn:()=>api<{capabilities?:{organization_workspace_create?:boolean}}>("/health"),retry:false});\n'''
          if text.count(query_anchor)!=1: raise SystemExit('runtime query anchor mismatch')
          text=text.replace(query_anchor,query_replacement,1)

          role_old='''  const canCreateOrgWorkspace=memberRole==="OWNER"||memberRole==="ADMIN"||memberRole==="ANALYST";\n'''
          role_new='''  const orgWorkspaceRuntimeReady=runtimeCapabilities.data?.capabilities?.organization_workspace_create===true;\n  const canCreateOrgWorkspace=orgWorkspaceRuntimeReady&&(memberRole==="OWNER"||memberRole==="ADMIN"||memberRole==="ANALYST");\n'''
          if text.count(role_old)!=1: raise SystemExit('role capability anchor mismatch')
          text=text.replace(role_old,role_new,1)

          viewer_old='''      {!canCreateOrgWorkspace?<p className="sectionLead">VIEWER membership is read-only. Ask an organization owner or administrator to grant ANALYST or higher access before creating a workspace.</p>:null}\n'''
          viewer_new='''      {!orgWorkspaceRuntimeReady?<p className="sectionLead" role="status">Organization workspace creation is locked until the production Edge runtime advertises the required capability. No fallback to a personal workspace is permitted.</p>:null}\n      {orgWorkspaceRuntimeReady&&!canCreateOrgWorkspace?<p className="sectionLead">VIEWER membership is read-only. Ask an organization owner or administrator to grant ANALYST or higher access before creating a workspace.</p>:null}\n'''
          if text.count(viewer_old)!=1: raise SystemExit('viewer message anchor mismatch')
          text=text.replace(viewer_old,viewer_new,1)
          page.write_text(text)

          test=Path('apps/web/e2e/organization-workspace-create.spec.ts')
          test_text=test.read_text()
          test_text=test_text.replace('JSON.stringify({status:"ready"})','JSON.stringify({status:"ready",capabilities:{organization_workspace_create:true}})')
          if test_text.count('organization_workspace_create:true')<2: raise SystemExit('capability test mocks not updated')
          test.write_text(test_text)

          source=page.read_text()
          assert 'orgWorkspaceRuntimeReady=runtimeCapabilities.data?.capabilities?.organization_workspace_create===true' in source
          assert 'No fallback to a personal workspace is permitted.' in source
          assert 'capabilities:{organization_workspace_create:true}' in edge.read_text()
      - name: Verify capability contract
        run: |
          grep -q 'organization_workspace_create:true' supabase/functions/rivexis-api/index.ts
          grep -q 'orgWorkspaceRuntimeReady' apps/web/app/workspace/settings/page.tsx
          grep -q 'No fallback to a personal workspace is permitted' apps/web/app/workspace/settings/page.tsx
      - name: Remove one-shot workflow and push patch
        run: |
          rm .github/workflows/one-shot-org-workspace-capability.yml
          git config user.name "Rivexis Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Gate organization workspaces on Edge capability"
          git push origin HEAD:main
