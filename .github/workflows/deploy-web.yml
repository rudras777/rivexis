name: deploy-web

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivexis-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_RIVEXIS_API_URL: same-origin
      NEXT_PUBLIC_RIVEXIS_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Preflight Cloudflare deployment authority
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions secrets."
            exit 1
          fi

          CF_TOKEN="$(python - <<'PY'
          import os
          value=os.environ.get('CLOUDFLARE_API_TOKEN','').strip()
          for quote in ('"', "'"):
              if len(value)>=2 and value.startswith(quote) and value.endswith(quote):
                  value=value[1:-1].strip()
          if value.lower().startswith('bearer '):
              value=value[7:].strip()
          print(value,end='')
          PY
          )"
          CF_ACCOUNT_ID="$(python - <<'PY'
          import os
          value=os.environ.get('CLOUDFLARE_ACCOUNT_ID','').strip()
          for quote in ('"', "'"):
              if len(value)>=2 and value.startswith(quote) and value.endswith(quote):
                  value=value[1:-1].strip()
          print(value,end='')
          PY
          )"
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare credentials are empty after safe normalization."
            exit 1
          fi
          echo "::add-mask::$CF_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"

          user_verify_json="$(curl -sS --max-time 20 \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H 'Content-Type: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          account_verify_json="$(curl -sS --max-time 20 \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/tokens/verify" || true)"
          USER_VERIFY_JSON="$user_verify_json" ACCOUNT_VERIFY_JSON="$account_verify_json" python - <<'PY'
          import json, os, sys
          payloads=[]
          for key,label in (('USER_VERIFY_JSON','user'),('ACCOUNT_VERIFY_JSON','account')):
              raw=os.environ.get(key,'')
              try:
                  payload=json.loads(raw)
              except Exception:
                  payload={}
              payloads.append((label,payload))
          if any(payload.get('success') is True for _,payload in payloads):
              sys.exit(0)
          summaries=[]
          for label,payload in payloads:
              errors=payload.get('errors') or []
              codes=','.join(str(e.get('code')) for e in errors if e.get('code') is not None) or 'unknown'
              summaries.append(f'{label}:{codes}')
          print(f"::error::Cloudflare token verification failed for both supported token scopes ({'; '.join(summaries)}).")
          sys.exit(1)
          PY

          service_json="$(curl -sS --max-time 20 \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/services/rivexis-web" || true)"
          SERVICE_JSON="$service_json" python - <<'PY'
          import json, os, sys
          raw=os.environ.get('SERVICE_JSON','')
          try:
              payload=json.loads(raw)
          except Exception:
              print('::error::Cloudflare Worker access preflight returned a non-JSON or empty response.')
              sys.exit(1)
          if payload.get('success') is not True:
              errors=payload.get('errors') or []
              codes=', '.join(str(e.get('code')) for e in errors if e.get('code') is not None) or 'unknown'
              print(f'::error::Cloudflare token/account pair cannot access the existing rivexis-web Worker (codes: {codes}).')
              sys.exit(1)
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Recheck web source before deployment
        run: |
          npm run typecheck:web
          npm --workspace @rivexis/web run build:vinext

      - name: Deploy existing rivexis-web Worker
        shell: bash
        run: |
          set -euo pipefail
          CF_TOKEN="$(python - <<'PY'
          import os
          value=os.environ.get('CLOUDFLARE_API_TOKEN','').strip()
          for quote in ('"', "'"):
              if len(value)>=2 and value.startswith(quote) and value.endswith(quote):
                  value=value[1:-1].strip()
          if value.lower().startswith('bearer '):
              value=value[7:].strip()
          print(value,end='')
          PY
          )"
          CF_ACCOUNT_ID="$(python - <<'PY'
          import os
          value=os.environ.get('CLOUDFLARE_ACCOUNT_ID','').strip()
          for quote in ('"', "'"):
              if len(value)>=2 and value.startswith(quote) and value.endswith(quote):
                  value=value[1:-1].strip()
          print(value,end='')
          PY
          )"
          echo "::add-mask::$CF_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" npm --workspace @rivexis/web run deploy:vinext

      - name: Verify exact commit is live
        shell: bash
        run: |
          set -euo pipefail
          url="https://rivexis-web.rudrasingh0718.workers.dev/?build=${DEPLOY_SHA}"
          verified=0
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$url" || true)"
            if printf '%s' "$body" | grep -Fq 'rivexis-build' && printf '%s' "$body" | grep -Fq "$DEPLOY_SHA"; then
              verified=1
              break
            fi
            sleep 5
          done
          if [ "$verified" -ne 1 ]; then
            echo "::error::The public Worker did not expose the expected build SHA ${DEPLOY_SHA}."
            exit 1
          fi
          printf '%s' "$body" | grep -Fq 'Evidence before'
          echo "Verified ${DEPLOY_SHA} on the authoritative public Worker." >> "$GITHUB_STEP_SUMMARY"
