name: rvea-pages-gateway-preview

on:
  push:
    branches: ["main", "infra/rvea-pages-gateway-20261029"]
    paths:
      - "infrastructure/rvea-pages-gateway/**"
      - ".github/workflows/rvea-pages-gateway-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rvea-pages-gateway
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/infra/rvea-pages-gateway-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install repository's pinned dependencies
        run: npm ci
      - name: Run ingress tests before using Cloudflare credentials
        run: node --test infrastructure/rvea-pages-gateway/gateway.test.mjs
      - name: Verify existing Worker and deploy Pages gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0b22778ba197266a58dd26eeef0334a8
          RVEA_PAGES_PROJECT: rvea-rivexis-gateway
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const token=process.env.CLOUDFLARE_API_TOKEN??"";
            if(!/^[A-Za-z0-9_-]{40,}$/.test(token)) {
              console.error("::error::CLOUDFLARE_PAGES_API_TOKEN must contain only the raw scoped token, without quotes, prefixes or whitespace.");
              process.exit(1);
            }
          '
          SERVICE_JSON="$(curl -sS --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/rivexis-web")"
          SERVICE_JSON="$SERVICE_JSON" node -e '
            let p;
            try { p=JSON.parse(process.env.SERVICE_JSON); } catch { p={}; }
            if(p.success!==true || !p.result) {
              console.error("::error::Original Worker inspection failed; Cloudflare codes:", (p.errors??[]).map(e=>e.code).join(",")||"unknown");
              process.exit(1);
            }
            console.log("Original rivexis-web Worker inspection succeeded.");
          '
          npx --no-install wrangler pages project list --json > /tmp/rvea-pages-projects.json
          EXISTS="$(node -e '
            const data=JSON.parse(require("fs").readFileSync("/tmp/rvea-pages-projects.json","utf8"));
            if(!Array.isArray(data)) throw new Error("Unexpected Pages project inventory");
            process.stdout.write(String(data.some(p=>p["Project Name"]===process.env.RVEA_PAGES_PROJECT)));
          ')"
          if [ "$EXISTS" = "false" ]; then
            # Wrangler 4.148.0 --force selects Pages instead of automatic Workers delegation.
            npx --no-install wrangler pages project create "${RVEA_PAGES_PROJECT}" --production-branch main --force
          fi
          npx --no-install wrangler pages deploy \
            --cwd infrastructure/rvea-pages-gateway \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --force
          echo "Pages deployment submitted; no custom-domain or Wix DNS mutation was attempted."
