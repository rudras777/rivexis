name: cloudflare-credential-diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Report non-secret credential shape
        shell: bash
        run: |
          python - <<'PY'
          import os,re

          raw=os.environ.get('CLOUDFLARE_API_TOKEN','')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          value=raw.strip()
          wrapped_assignment=value.upper().startswith(('CLOUDFLARE_API_TOKEN=','CF_API_TOKEN='))
          has_bearer=bool(re.search(r'(?i)\bBearer\s+',value))
          has_internal_whitespace=bool(re.search(r'\s',value.strip()))

          for quote in ('"', "'"):
              if len(value)>=2 and value.startswith(quote) and value.endswith(quote):
                  value=value[1:-1].strip()
          for prefix in ('CLOUDFLARE_API_TOKEN=','CF_API_TOKEN='):
              if value.upper().startswith(prefix):
                  value=value[len(prefix):].strip()
          bearer=re.search(r'(?i)Bearer\s+([^\s"\']+)',value)
          if bearer:
              value=bearer.group(1).strip()
          prefixed=re.search(r'(cf(?:ut|at|k)_[A-Za-z0-9_-]+)',value)
          if prefixed:
              value=prefixed.group(1)
          value=value.strip().strip('"\'`;,')

          if value.startswith('cfut_'): shape='user-token-prefixed'
          elif value.startswith('cfat_'): shape='account-token-prefixed'
          elif value.startswith('cfk_'): shape='global-key-prefixed'
          elif re.fullmatch(r'[A-Za-z0-9]{40}',value): shape='legacy-40-char-token-or-key'
          elif re.fullmatch(r'[0-9a-fA-F]{37,45}',value): shape='legacy-hex-global-key-like'
          elif re.fullmatch(r'[0-9a-fA-F]{32}',value): shape='account-id-like'
          elif not value: shape='empty'
          else: shape='unknown'

          account_clean=account.strip().strip('"\'')
          for prefix in ('CLOUDFLARE_ACCOUNT_ID=','CF_ACCOUNT_ID='):
              if account_clean.upper().startswith(prefix):
                  account_clean=account_clean[len(prefix):].strip()
          account_shape='32-hex-account-id' if re.fullmatch(r'[0-9a-fA-F]{32}',account_clean) else ('empty' if not account_clean else 'other')

          print(f'token_shape={shape}')
          print(f'token_length={len(value)}')
          print(f'raw_assignment_wrapper={wrapped_assignment}')
          print(f'raw_bearer_wrapper={has_bearer}')
          print(f'raw_internal_whitespace={has_internal_whitespace}')
          print(f'account_shape={account_shape}')
          print(f'account_length={len(account_clean)}')
          PY
