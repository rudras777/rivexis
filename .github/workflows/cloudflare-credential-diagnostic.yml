name: cloudflare-credential-diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Report non-secret credential shape
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,re

          raw=os.environ.get('CLOUDFLARE_API_TOKEN','')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          value=raw.strip()
          wrapped_assignment=value.upper().startswith(('CLOUDFLARE_API_TOKEN=','CF_API_TOKEN='))
          has_bearer=bool(re.search(r'(?i)\bBearer\s+',value))
          has_internal_whitespace=bool(re.search(r'\s',value.strip()))

          for quote in ('"', "'"):
              if len(value)>=2 and value.startswith(quote) and value.endswith(quote):
                  value=value[1:-1].strip()
          for prefix in ('CLOUDFLARE_API_TOKEN=','CF_API_TOKEN='):
              if value.upper().startswith(prefix):
                  value=value[len(prefix):].strip()
          bearer=re.search(r'(?i)Bearer\s+([^\s"\']+)',value)
          if bearer:
              value=bearer.group(1).strip()
          prefixed=re.search(r'(cf(?:ut|at|k)_[A-Za-z0-9_-]+)',value)
          if prefixed:
              value=prefixed.group(1)
          value=value.strip().strip('"\'`;,')

          known_prefix='none'
          for prefix,label in (
              ('cfut_','cloudflare-user-token'),('cfat_','cloudflare-account-token'),
              ('cfk_','cloudflare-global-key'),('cfast_','cloudflare-access-service-secret'),
              ('github_pat_','github-fine-grained-pat'),('ghp_','github-classic-pat'),
              ('gho_','github-oauth-token'),('ghu_','github-user-token'),
              ('ghs_','github-server-token'),('ghr_','github-refresh-token'),
              ('eyJ','jwt-like'),('sk-','generic-sk-secret'),('pk_','generic-public-key')
          ):
              if value.startswith(prefix):
                  known_prefix=label
                  break

          if value.startswith('cfut_'): shape='user-token-prefixed'
          elif value.startswith('cfat_'): shape='account-token-prefixed'
          elif value.startswith('cfk_'): shape='global-key-prefixed'
          elif value.startswith('cfast_'): shape='access-service-token-secret'
          elif re.fullmatch(r'[A-Za-z0-9]{40}',value): shape='legacy-40-char-token-or-key'
          elif re.fullmatch(r'[0-9a-fA-F]{37,45}',value): shape='legacy-hex-global-key-like'
          elif re.fullmatch(r'[0-9a-fA-F]{32}',value): shape='account-id-like'
          elif not value: shape='empty'
          else: shape='unknown'

          charset=(
              'hex' if re.fullmatch(r'[0-9a-fA-F]+',value or '!') else
              'alnum' if re.fullmatch(r'[A-Za-z0-9]+',value or '!') else
              'base64url-like' if re.fullmatch(r'[A-Za-z0-9_-]+={0,2}',value or '!') else
              'other'
          )
          dot_count=value.count('.')
          jwt_like=dot_count==2 and all(re.fullmatch(r'[A-Za-z0-9_-]+',part or '!') for part in value.split('.'))

          decoded_class='not-base64-wrapper'
          if re.fullmatch(r'[A-Za-z0-9_\-+/]+={0,2}',value or '!'):
              for decoder in (base64.urlsafe_b64decode,base64.b64decode):
                  try:
                      padded=value+'='*((4-len(value)%4)%4)
                      decoded=decoder(padded.encode()).decode('utf-8')
                  except Exception:
                      continue
                  stripped=decoded.strip()
                  if stripped.startswith(('cfut_','cfat_','cfk_')):
                      decoded_class='encoded-cloudflare-api-credential'
                  elif stripped.lower().startswith('bearer '):
                      decoded_class='encoded-bearer-wrapper'
                  else:
                      try:
                          obj=json.loads(stripped)
                          if isinstance(obj,dict) and any(k in obj for k in ('token','api_token','CLOUDFLARE_API_TOKEN')):
                              decoded_class='encoded-json-token-wrapper'
                          else:
                              decoded_class='encoded-other-json'
                      except Exception:
                          decoded_class='encoded-other-text'
                  break

          account_clean=account.strip().strip('"\'')
          for prefix in ('CLOUDFLARE_ACCOUNT_ID=','CF_ACCOUNT_ID='):
              if account_clean.upper().startswith(prefix):
                  account_clean=account_clean[len(prefix):].strip()
          account_shape='32-hex-account-id' if re.fullmatch(r'[0-9a-fA-F]{32}',account_clean) else ('empty' if not account_clean else 'other')

          print(f'token_shape={shape}')
          print(f'token_length={len(value)}')
          print(f'known_prefix_class={known_prefix}')
          print(f'charset_class={charset}')
          print(f'dot_count={dot_count}')
          print(f'jwt_like={jwt_like}')
          print(f'base64_decode_class={decoded_class}')
          print(f'raw_assignment_wrapper={wrapped_assignment}')
          print(f'raw_bearer_wrapper={has_bearer}')
          print(f'raw_internal_whitespace={has_internal_whitespace}')
          print(f'account_shape={account_shape}')
          print(f'account_length={len(account_clean)}')
          PY
