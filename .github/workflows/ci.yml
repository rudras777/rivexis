name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.13'}
      - run: python -m pip install --upgrade pip setuptools
      - run: cd apps/api && pip install -e '.[dev,full]'
      - run: cd apps/api && ruff check rivexis_api tests
      - run: cd apps/api && pytest -q
      - run: cd apps/api && pip-audit --skip-editable
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: 'npm'}
      - run: npm ci
      - run: node --check apps/web/scripts/cloudflare-workers-build-deploy.mjs
      - run: node --test scripts/npm-audit-ci.test.mjs
      - run: npm run typecheck:api-edge
      - run: npx --yes deno@2.9.6 check --config supabase/functions/rivexis-api/deno.json supabase/functions/rivexis-api/index.ts supabase/functions/rivexis-decision-reports/index.ts supabase/functions/rivexis-alerts/index.ts supabase/functions/rivexis-alert-dispatch/index.ts
      - run: npm run test:api-edge
      - run: npm run test:defi
      - run: node --test scripts/certify_aave_sequence_rpc.test.mjs
      - run: node --test apps/web/lib/market-feed.test.mjs
      - run: node --test apps/web/lib/api.test.mjs
      - run: node --test apps/web/lib/edge-api-proxy.test.mjs
      - run: node --test apps/web/lib/wallet-access.test.mjs
      - run: node --test apps/web/e2e/navigation-driver-policy.test.mjs
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web
      - run: npm --workspace @rivexis/web run build:vinext
      - run: node scripts/npm-audit-ci.mjs
      - name: Use official Ubuntu HTTPS archives for browser dependencies
        # Keep package verification and browser versions; avoid the stalled Azure HTTP mirror.
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          if test -f /etc/apt/apt-security-mirrors.txt; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.13'}
      - run: python -m pip install -e './apps/api'
      - run: python scripts/check_invariants.py
      - run: python scripts/check_migrations.py
      - run: python scripts/secret_scan.py
      - name: Reject unsafe database restore destinations
        run: python -m unittest discover -s scripts -p test_backup_restore_guard.py
  postgres-migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rivexis_ci
          POSTGRES_PASSWORD: ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rivexis_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.13'}
      - run: python -m pip install -e './apps/api[postgres]'
      - name: Create non-bypass migration role
        env:
          PGPASSWORD: ci_only
        run: |
          psql -h 127.0.0.1 -U postgres -d rivexis_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE rivexis_migrator LOGIN PASSWORD 'ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
          psql -h 127.0.0.1 -U postgres -d rivexis_ci -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO rivexis_migrator"
          psql -h 127.0.0.1 -U postgres -d rivexis_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE rivexis_app LOGIN PASSWORD 'ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOINHERIT NOBYPASSRLS"
          psql -h 127.0.0.1 -U postgres -d rivexis_ci -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE rivexis_ci TO rivexis_app; GRANT USAGE ON SCHEMA public TO rivexis_app"
      - name: Upgrade actual PostgreSQL schema
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://rivexis_migrator:ci_only@127.0.0.1:5432/rivexis_ci
        run: python -m alembic upgrade head
      - name: Certify distributed PostgreSQL runtime controls
        env:
          DATABASE_URL: postgresql+psycopg://rivexis_app:ci_only@127.0.0.1:5432/rivexis_ci
        run: python scripts/certify_postgres_distributed_controls.py
      - name: Verify migrated PostgreSQL schema
        env:
          DATABASE_URL: postgresql+psycopg://rivexis_migrator:ci_only@127.0.0.1:5432/rivexis_ci
        run: python scripts/verify_postgres_migrated_schema.py
      - name: Certify private legacy table RLS without widening client grants
        env:
          PGPASSWORD: ci_only
        run: |
          psql -h 127.0.0.1 -U postgres -d rivexis_ci -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; GRANT USAGE ON SCHEMA public TO anon, authenticated"
          psql -h 127.0.0.1 -U postgres -d rivexis_ci -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE ON public.users, public.data_sources TO rivexis_app"
          psql -h 127.0.0.1 -U postgres -d rivexis_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261009145634_legacy_private_table_rls.sql
          psql -h 127.0.0.1 -U postgres -d rivexis_ci -v ON_ERROR_STOP=1 -f supabase/tests/legacy_private_table_rls.sql
      - name: Restore actual CI fixture into a disposable local database
        env:
          PGPASSWORD: ci_only
          RIVEXIS_BACKUP_SOURCE_DATABASE_URL: postgresql://postgres:ci_only@127.0.0.1:5432/rivexis_ci
          RIVEXIS_BACKUP_RESTORE_DATABASE_URL: postgresql://postgres:ci_only@127.0.0.1:5432/rivexis_restore_ci
          RIVEXIS_BACKUP_RESTORE_ALLOW_APPLY: 'true'
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            # Official signed PostgreSQL repository; Ubuntu's default client is 16.
            . /etc/os-release
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/rivexis-pgdg.sources >/dev/null
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          psql -h 127.0.0.1 -U postgres -d rivexis_ci -v ON_ERROR_STOP=1 -c "CREATE DATABASE rivexis_restore_ci"
          python scripts/certify_postgres_dr.py
          python scripts/verify_postgres_dr_atomicity.py
