<svg xmlns="http://www.w3.org/2000/svg" width="480" height="324" viewBox="0 0 480 324" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Inspect the consequences of a proposed transaction</title>
  <rect width="480" height="324" fill="#141B1D"/>
  <desc id="desc">A proposed transaction is assessed against balances, allowances and fees, then its supported position effects are modeled. No signature or submission is represented.</desc>
  <defs><linearGradient id="flow" x1="78" y1="64" x2="401" y2="268" gradientUnits="userSpaceOnUse"><stop stop-color="#80AAA1"/><stop offset="1" stop-color="#B5A383"/></linearGradient></defs>
  <path d="M24 56H456M24 300H456" stroke="#303E40"/>
  <g stroke="url(#flow)" stroke-width="1.5" stroke-linecap="round">
    <path d="M240 71v22m0 0H94c-12 0-18 6-18 18v12m164-30v30m0-30h146c12 0 18 6 18 18v12"/>
    <circle cx="76" cy="132" r="9"/><circle cx="240" cy="132" r="9"/><circle cx="404" cy="132" r="9"/>
    <path d="M76 187v12c0 12 6 18 18 18h292c12 0 18-6 18-18v-12m-164 0v49"/><circle cx="240" cy="253" r="16"/><path d="M234 247h12m-12 6h12m-12 6h7"/>
  </g>
  <g fill="#E9EBE7" font-family="Arial, sans-serif" font-size="26" text-anchor="middle"><text x="240" y="36">Proposed transaction</text><text x="76" y="170">Balance</text><text x="240" y="170">Allowance</text><text x="404" y="170">Fees</text><text x="240" y="294">Position effects</text></g>
</svg>
