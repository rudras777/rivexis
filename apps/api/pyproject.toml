[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rivexis-api"
version = "3.4.3"
description = "Rivexis institutional blockchain and DeFi risk decision API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pip-audit>=2.7"]
distributed = ["redis>=8.1,<9"]
postgres = ["psycopg[binary]>=3.2,<4"]
production = ["psycopg[binary]>=3.2,<4", "redis>=8.1,<9"]
observability = ["opentelemetry-api>=1.42,<2", "opentelemetry-sdk>=1.42,<2", "opentelemetry-exporter-otlp-proto-http>=1.42,<2"]
full = ["psycopg[binary]>=3.2,<4", "redis>=8.1,<9", "opentelemetry-api>=1.42,<2", "opentelemetry-sdk>=1.42,<2", "opentelemetry-exporter-otlp-proto-http>=1.42,<2"]

[tool.setuptools.packages.find]
include = ["rivexis_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Baseline the archived code's compact style while retaining fatal syntax/name checks.
# Expand lint coverage in a separate, reviewed cleanup rather than autofixing the API wholesale.
select = ["E9", "F63", "F7", "F82"]
